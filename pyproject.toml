[project]
name = "minicode"
version = "0.1.0"
description = "Hand-written agent loop + mini coding agent (no framework)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "httpx>=0.27", "textual>=8.0"]   # httpx: FastAPI TestClient for tests/test_server.py
tui = ["textual>=8.0"]                          # the full-screen terminal UI (minicode with no task); tested with Textual 8.2
serve = ["fastapi>=0.110", "uvicorn>=0.30"]   # optional HTTP service (minicode-serve); the agent itself needs nothing

[project.scripts]
minicode = "minicode.cli:main"
minicode-eval = "minicode.eval.cli:main"
minicode-serve = "minicode.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["minicode", "minicode.eval", "minicode.mcp", "minicode.taskgen", "minicode.tui"]

[tool.setuptools.package-data]
"minicode.eval" = ["viewer/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 160
target-version = "py310"
extend-exclude = ["gen_tasks", "seeds", "tasks", "models", "adapters", ".venv", ".venv-mlx", ".venv-sdk"]

[tool.ruff.lint]
# pyflakes + pycodestyle errors (E/W) + the bug-prone parts of bugbear + import sorting is left alone on purpose
select = ["E", "F", "W", "B"]
ignore = [
    "E701", "E702", "E731",   # one-line `if x: y`, `a; b` and lambda assignment are used on purpose in the tests and the viewer glue
    "E741",                   # short loop names like `l` in line iterations
    "B008", "B904", "B905",  # function-call defaults, `raise ... from`, zip(strict=) are not worth the churn here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "B017", "E501"]
"scripts/*" = ["E501"]

[tool.coverage.run]
source = ["minicode"]
branch = true

[tool.coverage.report]
# Measured without Docker: sandbox.py and taskgen/generate.py are exercised by the "docker sandbox tests" CI job, eval/cli.py (the run /
# export / report commands) is the weakest part. The floor is a tripwire against losing tests, not a target.
fail_under = 80
skip_covered = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
