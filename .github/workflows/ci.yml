name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: tests (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev,serve]"
      - run: ruff check .
      - run: pytest -q --cov --cov-report=term-missing:skip-covered
      - name: coverage summary
        if: matrix.python == '3.12'
        run: coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      # the golden trajectories must stay valid against the documented schema
      - run: miniagent-eval check-trajectories tests/golden

  sandbox:
    name: docker sandbox tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: miniagent-eval sandbox-build
      # with the image present these run for real instead of being skipped
      - run: pytest -q tests/test_sandbox.py tests/test_taskgen.py

  mcp-interop:
    name: MCP interop with the official SDK
    runs-on: ubuntu-latest
    continue-on-error: true      # tracks a third-party release: a failure is a signal to look, not a broken build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . mcp
      - run: python scripts/mcp_interop.py
